services:
  duckduckgo-mcp:
    build: ./ddg-mcp
    image: ddg-mcp:latest
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "7070"]
    ports:
      - "7070:7070"
    restart: unless-stopped
    networks:
      - homelab

  memos:
    image: docker.io/neosmemo/memos:stable
    container_name: memos
    ports:
      - "5230:5230"
    volumes:
      - "/home/poske/.local/share/memos:/var/opt/memos"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - "/home/poske/.local/share/open-webui:/app/backend/data"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEBUI_SECRET_KEY=SECRET_KEY
    restart: unless-stopped
    networks:
      - homelab

networks:
  homelab:
    driver: bridge
