services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    ports:
      - "8080:8080"
    volumes:
      - "/home/poske/.cache/models:/models:ro"
    devices:
      - "nvidia.com/gpu=all"
    restart: unless-stopped
    command: >-
      --model /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --ui-mcp-proxy
      --ctx-size 0
      --load-mode none
    networks:
      - homelab

  duckduckgo-mcp:
    build: ./ddg-mcp
    image: ddg-mcp:latest
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "7070"]
    ports:
      - "7070:7070"
    restart: unless-stopped
    networks:
      - homelab

  memos:
    image: docker.io/neosmemo/memos:stable
    container_name: memos
    ports:
      - "5230:5230"
    volumes:
      - "/home/poske/.local/share/memos:/var/opt/memos"
    restart: unless-stopped

networks:
  homelab:
    driver: bridge
