services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    ports:
      - "8080:8080"
    volumes:
      - "/home/poske/.cache/models:/models:ro"
    devices:
      - "nvidia.com/gpu=all"
    restart: unless-stopped
    command: >-
      --model /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --ui-mcp-proxy
      --ctx-size 0
  duckduckgo-mcp:
    build:
      context: ddg-mcp/
      dockerfile_inline: |
        FROM python:3.13-slim
        WORKDIR /app
        COPY . /app
        RUN pip install --no-cache-dir --upgrade pip \
        && pip install --no-cache-dir .
        ENTRYPOINT ["python", "-m", "duckduckgo_mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "7070"]
        CMD []
    ports:
      - "7070:7070"
    restart: unless-stopped
